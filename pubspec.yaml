name: freshkeep
description: A bilingual local-first household food companion.
publish_to: none
version: 0.5.10+10
environment:
  sdk: ^3.13.5
  flutter: '>=3.47.7'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  go_router: ^18.1.0
  google_fonts: ^9.0.0
  flutter_svg: ^2.3.0
  flutter_animate: ^4.5.2
  lottie: ^3.6.1
  fl_chart: ^1.2.0
  sqflite: ^2.4.4+2
  path: ^1.9.1
  path_provider: ^2.1.6
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  http: ^1.6.0
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^4.0.4
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.4
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/recipes/recipes.json
    - assets/recipes/fitness_recipes.json
    - assets/images/recipes/
    - assets/images/foods/
    - assets/storage/storage_guide.json
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
